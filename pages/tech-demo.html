<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" href="../favicon.png">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <main>
        <div class="page">
            <div class="crt">
                <svg><defs>
                    <filter id="displacementFilter" color-interpolation-filters="sRGB">
                              <feFlood
                                    x="50"
                                    y="50"
                                    width="100"
                                    height="100"
                                    flood-color="green"
                                    flood-opacity="0.5" 
                                    result="flood"/>
                        <feDisplacementMap
                            in2="flood"
                            in="crt"
                            scale="15"
                            xChannelSelector="R"
                            yChannelSelector="G" />
                    </filter>
                </defs></svg>
            </div>
        </div>
    </main>
</body>
</html>
