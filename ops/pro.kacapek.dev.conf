# /etc/nginx/sites-available/pro.kacapek.dev  — same shape as kacapek.dev
server {
    listen 80;
    listen [::]:80;
    server_name pro.kacapek.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://pro.kacapek.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pro.kacapek.dev;
    root /var/www/pro.kacapek.dev/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/pro.kacapek.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pro.kacapek.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ =404;
    }
}
