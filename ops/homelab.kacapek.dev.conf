# /etc/nginx/sites-available/homelab.kacapek.dev — private, behind basic auth
server {
    listen 80;
    listen [::]:80;
    server_name homelab.kacapek.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://homelab.kacapek.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name homelab.kacapek.dev;
    root /var/www/homelab.kacapek.dev;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/homelab.kacapek.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homelab.kacapek.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Password set on the Pi: /etc/nginx/htpasswd-homelab. No file = nobody gets in.
    auth_basic "homelab";
    auth_basic_user_file /etc/nginx/htpasswd-homelab;

    # Never let Cloudflare cache a page that sits behind a password.
    add_header Cache-Control "private, no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
